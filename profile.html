<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="container">

<aside class="sidebar" id="sidebar">
  <button class="toggle-sidebar-btn" title="Свернуть/развернуть">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="profile-block">
    <div class="profile-avatar" style="background-image: url('assets/img/user-avatar.jpg');"></div>
    <div class="nav-text logo-text">-</div>
  </div>

  <nav class="mt-6">
    <a href="index.html" class="nav-item" data-label="Начальная страница">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="nav-label">Начальная страница</span>
    </a>

    <a href="profile.html" class="nav-item active" data-label="Личный кабинет">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="nav-label">Личный кабинет</span>
    </a>

    <a href="aut.html" class="nav-item" data-label="11">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/>
      </svg>
      <span class="nav-label">Автоматизатор иерархии</span>
    </a>

    <a href="test.html" class="nav-item" data-label="11">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span class="nav-label">1C ПРОФ</span>
    </a>

    <div class="my-6 border-t border-white/15"></div>

  </nav>
</aside>

<div class="main-content">

  <header class="header">
    <button class="menu-toggle">☰</button>
    <h1>Личный кабинет</h1>

    <div style="display:flex; align-items:center; gap:1.25rem;">
      <input type="search" placeholder="Поиск..." style="width:15rem; padding:0.5rem 1rem; border:1px solid var(--gray-300); border-radius:6px;">

      <div style="display:flex; align-items:center; gap:0.75rem; cursor:pointer;">
        <div style="width:2.5rem; height:2.5rem; background:#3b82f6; border-radius:999px; color:white; font-weight:600; display:flex; align-items:center; justify-content:center;"><div class="profile-avatar" style="background-image: url('assets/img/ava.jpg');"></div></div>
        <div>
          <div style="font-weight:500;">Тест</div>
          <div style="font-size:0.875rem; color:var(--gray-500);">Тестовый</div>
        </div>
      </div>
    </div>
  </header>

  <main style="padding:1.5rem 1.5rem 3rem;">

    <!-- Профиль -->
    <section class="card">
      <h2 style="font-size:1.4rem; font-weight:600; margin-bottom:1.5rem;">Профиль</h2>
      <div style="display:flex; align-items:start; gap:2rem;">
        <div class="profile-avatar" style="width:80px; height:80px; background-image: url('assets/img/ava.jpg'); border-radius:50%;"></div>
        <div style="flex:1;">
          <div style="margin-bottom:1rem;">
            <label style="display:block; font-weight:500; margin-bottom:0.5rem;">Отображаемое имя</label>
            <input type="text" value="Тест" style="padding:0.75rem; border:1px solid var(--gray-300); border-radius:6px;">
          </div>
          <div style="display:flex; flex-direction:column; gap:1rem;">
            <a href="#" style="color:var(--primary); text-decoration:none;">Загрузить фото</a>
            <a href="#" style="color:var(--primary); text-decoration:none;">Удалить фото</a>
            <a href="#" style="color:var(--primary); text-decoration:none;">Сменить пароль</a>
          </div>
        </div>
      </div>
    </section>


    <!-- Внешний вид системы -->
    <section class="card mb-6">
      <h2 style="font-size:1.4rem; font-weight:600; margin-bottom:1.5rem;">Внешний вид системы</h2>
      <div style="display:flex; align-items:center; gap:1rem;">
        <label style="font-weight:500;">Выберите цветовую схему:</label>
        <div style="display:flex; gap:1rem;">
          <button style="width:64px; height:48px; background:#2B3541; border-radius:8px; border: none;"></button>
          <button style="width:64px; height:48px; background:#F5F8FA; border-radius:8px; border: 4px solid var(--accent);"></button>
        </div>
      </div>
    </section>
  </main>

</div>
</div>

<script src="assets/js/main.js"></script>

</body>
</html>
