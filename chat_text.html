<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимус чат</title>
    <style>
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #c9d1d9; --accent: #238636;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 16px;
        }
        .chat {
            width: 100%; max-width: 520px; height: 100%;
            max-height: 750px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            font-weight: 600; font-size: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .status { width: 8px; height: 8px; border-radius: 50%; }
        .status.online { background: #3fb950; animation: pulse 2s infinite; }
        .status.offline { background: #f85149; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .status-text { font-size: 12px; color: #8b949e; font-weight: 400; }
        .messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .msg {
            max-width: 85%; padding: 8px 12px; border-radius: 12px;
            font-size: 14px; line-height: 1.4; word-break: break-word;
            animation: fadeIn .2s ease;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .msg-in {
            align-self: flex-start; background: #21262d;
            border: 1px solid var(--border); border-bottom-left-radius: 4px;
        }
        .msg-out {
            align-self: flex-end; background: #1a3a2a;
            border: 1px solid #238636; border-bottom-right-radius: 4px;
        }
        .msg .author {
            font-size: 11px; color: #58a6ff; margin-bottom: 2px; font-weight: 600;
        }
        .msg .author.me { color: #7ee787; }
        .msg .time {
            font-size: 10px; color: #484f58; margin-top: 3px; text-align: right;
        }
        .input-area {
            display: flex; gap: 8px; padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .input-area input {
            flex: 1; background: #0d1117; border: 1px solid var(--border);
            border-radius: 20px; padding: 10px 16px; color: var(--text);
            font-size: 14px; font-family: inherit; outline: none;
        }
        .input-area input:focus { border-color: #58a6ff; }
        .input-area button {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: var(--accent); color: #fff; font-size: 18px;
            cursor: pointer; flex-shrink: 0; transition: .15s;
        }
        .input-area button:hover { background: #2ea043; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .nick-row {
            display: flex; gap: 8px; padding: 8px 16px; align-items: center;
        }
        .nick-row input {
            flex: 1; background: #0d1117; border: 1px solid var(--border);
            border-radius: 8px; padding: 6px 10px; color: var(--text);
            font-size: 13px; outline: none; font-family: inherit;
        }
        .nick-row button {
            padding: 6px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text); cursor: pointer; font-size: 13px;
        }
        .nick-row button:hover { background: #21262d; }
    </style>
</head>
<body>
    <div class="chat">
        <div class="header">
            <span class="status online" id="statusDot"></span>
            Анонимный чат
            <span class="status-text" id="statusText">подключение...</span>
        </div>

        <div class="nick-row">
            <input id="nickInput" placeholder="Твой ник..." maxlength="20">
            <button id="nickBtn">OK</button>
        </div>

        <div class="messages" id="messages">
            <div style="text-align:center;color:#484f58;margin-top:40px;font-size:13px;">
                Загрузка сообщений...
            </div>
        </div>

        <div class="input-area">
            <input id="msgInput" placeholder="Сообщение..." maxlength="1000" autofocus>
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // ============ ВСТАВЬТЕ СВОЙ URL СЮДА ============
        const API_URL = 'https://script.google.com/macros/s/AKfycbyJcgwgglfJOYMQYjvDA1MmkRWR8-YmjxK7cco-9ribsutyD6B3TQoW6vX-3mI_S7t1cg/exec';
        // ==============================================

        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const nickInput = document.getElementById('nickInput');
        const nickBtn = document.getElementById('nickBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Загружаем ник из localStorage
        let nickname = localStorage.getItem('chat_nick') || '';
        if (!nickname) {
            nickname = 'Гость_' + Math.random().toString(36).substring(2, 7);
            localStorage.setItem('chat_nick', nickname);
        }
        nickInput.value = nickname;

        let lastMessageId = null;
        let isOnline = false;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                messagesDiv.innerHTML = '<div style="text-align:center;color:#484f58;margin-top:40px;font-size:13px;">Нет сообщений. Напиши первым!</div>';
                return;
            }

            messagesDiv.innerHTML = messages.map(m => {
                const isMe = m.nick === nickname;
                return `
                    <div class="msg ${isMe ? 'msg-out' : 'msg-in'}" data-id="${m.id}">
                        <div class="author ${isMe ? 'me' : ''}">${escapeHtml(m.nick)}</div>
                        <div>${escapeHtml(m.text)}</div>
                        <div class="time">${formatTime(m.timestamp)}</div>
                    </div>
                `;
            }).join('');

            // Автопрокрутка вниз, только если уже были внизу
            const wasAtBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 100;
            if (wasAtBottom || !lastMessageId) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // Запоминаем последний ID
            if (messages.length > 0) {
                lastMessageId = messages[messages.length - 1].id;
            }
        }

        async function loadMessages() {
            try {
                const res = await fetch(API_URL);
                const messages = await res.json();
                renderMessages(messages);
                updateStatus(true);
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                updateStatus(false);
            }
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !isOnline) return;

            sendBtn.disabled = true;
            msgInput.disabled = true;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ nick: nickname, text })
                });
                msgInput.value = '';
                await loadMessages(); // Обновляем сразу
            } catch (err) {
                console.error('Ошибка отправки:', err);
                updateStatus(false);
            }

            sendBtn.disabled = false;
            msgInput.disabled = false;
            msgInput.focus();
        }

        function updateStatus(online) {
            isOnline = online;
            if (online) {
                statusDot.className = 'status online';
                statusText.textContent = 'онлайн';
            } else {
                statusDot.className = 'status offline';
                statusText.textContent = 'офлайн';
            }
        }

        // Отправка
        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Смена ника
        nickBtn.addEventListener('click', () => {
            const newNick = nickInput.value.trim();
            if (newNick && newNick.length >= 2) {
                nickname = newNick;
                localStorage.setItem('chat_nick', nickname);
                loadMessages(); // Перерисовать
            }
        });

        // Автообновление каждые 2 секунды
        loadMessages();
        setInterval(loadMessages, 2000);

        // Обновление при возвращении на вкладку
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') loadMessages();
        });
    </script>
</body>
</html>
