<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимус чат</title>
    <style>
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #c9d1d9; --accent: #238636;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 16px;
        }
        .chat {
            width: 100%; max-width: 520px; height: 100%;
            max-height: 750px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            font-weight: 600; font-size: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .status { width: 8px; height: 8px; border-radius: 50%; }
        .status.online { background: #3fb950; animation: pulse 2s infinite; }
        .status.offline { background: #f85149; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .status-text { font-size: 12px; color: #8b949e; font-weight: 400; }
        .messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .msg {
            max-width: 85%; padding: 8px 12px; border-radius: 12px;
            font-size: 14px; line-height: 1.4; word-break: break-word;
            animation: fadeIn .2s ease;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .msg-in {
            align-self: flex-start; background: #21262d;
            border: 1px solid var(--border); border-bottom-left-radius: 4px;
        }
        .msg-out {
            align-self: flex-end; background: #1a3a2a;
            border: 1px solid #238636; border-bottom-right-radius: 4px;
        }
        .msg .author {
            font-size: 11px; color: #58a6ff; margin-bottom: 2px; font-weight: 600;
        }
        .msg .author.me { color: #7ee787; }
        .msg .time {
            font-size: 10px; color: #484f58; margin-top: 3px; text-align: right;
        }
        .input-area {
            display: flex; gap: 8px; padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .input-area input {
            flex: 1; background: #0d1117; border: 1px solid var(--border);
            border-radius: 20px; padding: 10px 16px; color: var(--text);
            font-size: 14px; font-family: inherit; outline: none;
        }
        .input-area input:focus { border-color: #58a6ff; }
        .input-area button {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: var(--accent); color: #fff; font-size: 18px;
            cursor: pointer; flex-shrink: 0; transition: .15s;
        }
        .input-area button:hover { background: #2ea043; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .nick-row {
            display: flex; gap: 8px; padding: 8px 16px; align-items: center;
        }
        .nick-row input {
            flex: 1; background: #0d1117; border: 1px solid var(--border);
            border-radius: 8px; padding: 6px 10px; color: var(--text);
            font-size: 13px; outline: none; font-family: inherit;
        }
        .nick-row button {
            padding: 6px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text); cursor: pointer; font-size: 13px;
        }
        .nick-row button:hover { background: #21262d; }
        .error-banner {
            background: #f85149; color: white; padding: 8px 16px;
            font-size: 13px; display: none; text-align: center;
        }
    </style>
</head>
<body>
    <div class="chat">
        <div class="header">
            <span class="status online" id="statusDot"></span>
            Анонимный чат
            <span class="status-text" id="statusText">подключение...</span>
        </div>

        <div class="error-banner" id="errorBanner">
            ⚠️ Ошибка подключения к серверу
        </div>

        <div class="nick-row">
            <input id="nickInput" placeholder="Твой ник..." maxlength="20">
            <button id="nickBtn">OK</button>
        </div>

        <div class="messages" id="messages">
            <div style="text-align:center;color:#484f58;margin-top:40px;font-size:13px;">
                Загрузка сообщений...
            </div>
        </div>

        <div class="input-area">
            <input id="msgInput" placeholder="Сообщение..." maxlength="1000" autofocus>
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // ============ ВСТАВЬТЕ СВОЙ URL СЮДА ============
        const API_URL = 'https://script.google.com/macros/s/AKfycbweRfPzC8IkpNF_EEX5sOMTqBtedOzUEw8J1Ues_JiaYUAaM4B0Dwz_WUaNno7epgwcsw/exec';
        // ==============================================

        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const nickInput = document.getElementById('nickInput');
        const nickBtn = document.getElementById('nickBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const errorBanner = document.getElementById('errorBanner');

        let nickname = localStorage.getItem('chat_nick') || '';
        if (!nickname) {
            nickname = 'Гость_' + Math.random().toString(36).substring(2, 7);
            localStorage.setItem('chat_nick', nickname);
        }
        nickInput.value = nickname;

        let isOnline = false;
        let errorCount = 0;
        const MAX_ERRORS = 3;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            try {
                const d = new Date(ts);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            } catch { return ''; }
        }

        function renderMessages(messages) {
            if (!messages || !Array.isArray(messages) || messages.length === 0) {
                messagesDiv.innerHTML = '<div style="text-align:center;color:#484f58;margin-top:40px;font-size:13px;">Нет сообщений. Напиши первым!</div>';
                return;
            }

            messagesDiv.innerHTML = messages.map(m => {
                const isMe = m.nick === nickname;
                return `
                    <div class="msg ${isMe ? 'msg-out' : 'msg-in'}">
                        <div class="author ${isMe ? 'me' : ''}">${escapeHtml(m.nick || 'Аноним')}</div>
                        <div>${escapeHtml(m.text || '')}</div>
                        <div class="time">${formatTime(m.timestamp)}</div>
                    </div>
                `;
            }).join('');

            const wasAtBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 100;
            if (wasAtBottom) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        async function loadMessages() {
            try {
                const res = await fetch(API_URL, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                
                const data = await res.json();
                
                // Проверяем, не вернул ли сервер ошибку
                if (data && data.error) {
                    console.warn('Сервер вернул ошибку:', data.error);
                    return;
                }
                
                renderMessages(Array.isArray(data) ? data : []);
                updateStatus(true);
                errorCount = 0;
                errorBanner.style.display = 'none';
                
            } catch (err) {
                console.error('Ошибка загрузки:', err.message);
                errorCount++;
                
                if (errorCount >= MAX_ERRORS) {
                    updateStatus(false);
                    errorBanner.style.display = 'block';
                }
            }
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !isOnline) return;

            sendBtn.disabled = true;
            msgInput.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nick: nickname, text })
                });
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                
                const data = await res.json();
                
                if (data.error) {
                    alert('Ошибка: ' + data.error);
                } else {
                    msgInput.value = '';
                    await loadMessages();
                }
            } catch (err) {
                console.error('Ошибка отправки:', err.message);
                alert('Не удалось отправить сообщение. Проверьте подключение.');
                updateStatus(false);
            }

            sendBtn.disabled = false;
            msgInput.disabled = false;
            msgInput.focus();
        }

        function updateStatus(online) {
            isOnline = online;
            if (online) {
                statusDot.className = 'status online';
                statusText.textContent = 'онлайн';
                errorBanner.style.display = 'none';
            } else {
                statusDot.className = 'status offline';
                statusText.textContent = 'офлайн';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        nickBtn.addEventListener('click', () => {
            const newNick = nickInput.value.trim();
            if (newNick && newNick.length >= 2) {
                nickname = newNick;
                localStorage.setItem('chat_nick', nickname);
                loadMessages();
            }
        });

        // Загружаем сразу и потом каждые 2 секунды
        loadMessages();
        setInterval(loadMessages, 2000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                errorCount = 0;
                loadMessages();
            }
        });
    </script>
</body>
</html>
